<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thoracic Diagnostics Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="text-slate-200 min-h-screen flex flex-col antialiased">

    <nav class="border-b border-slate-900 bg-slate-950/60 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="/" class="text-base font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-500 hover:opacity-90 transition">
                    PNEUMONIA.AI <span class="text-[9px] font-mono font-bold px-1.5 py-0.5 rounded border border-sky-500/30 text-sky-400 ml-1">v2.5</span>
                </a>
            </div>
            <div class="flex items-center space-x-4 text-[10px] font-mono text-slate-500">
                <span>PIPELINE: <span class="text-emerald-400 font-bold">ONLINE</span></span>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-950 bg-slate-950/30 text-center py-4 text-[10px] font-mono text-slate-600 tracking-wider uppercase">
        Advanced Institutional Intelligence Engineering System Core.
    </footer>

</body>
</html>
